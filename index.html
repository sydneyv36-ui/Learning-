<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Platform</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    text-align: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
  }
  h1 {
    font-size: 2.25rem;
    margin-bottom: 12px;
  }
  p {
    font-size: 1.1rem;
    color: #cbd5e1;
    margin-bottom: 32px;
  }
  button {
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 28px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #0f172a;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  button:hover {
    background: #7dd3fc;
  }
  button:active {
    transform: scale(0.97);
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome to the Learning Platform</h1>
    <p>Your space to explore, practice, and grow — one lesson at a time.</p>
    <button onclick="alert('Let\'s get started!')">Get Started</button>
  </div>
</body>
</html>
